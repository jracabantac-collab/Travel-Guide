<html>
<head>
  <title>Contacts</title>
  <style>
    body {
      background-image: url("https://i.pinimg.com/1200x/19/91/b5/1991b536c263e45ec7e9484cfe7fb217.jpg");
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: #F5EFE1;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      border: 1px solid #E2D5B7;
      box-sizing: border-box;
    }

    .header-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 8px 0;
      color: #3E2F26;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 20px 0;
      color: #6E5D4F;
      text-align: center;
      font-size: 14px;
    }

    hr {
      border: none;
      border-top: 1px solid #DFD3BC;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #4A3B32;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 18px;
      border: 1.5px solid #D5C7AC;
      border-radius: 12px;
      background-color: #FFFDF9;
      font-size: 14px;
      color: #333;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #A67B5B;
      box-shadow: 0 0 6px rgba(166, 123, 91, 0.3);
    }

    textarea {
      height: 100px;
      resize: vertical;
      font-family: inherit;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #8C6239;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: #704D2B;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #8C7B6B;
      margin-top: 16px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Contact Us!</h1>
    <p class="subtitle">Send a question or feedback here!</p>
    
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="9f21392f-4982-41ed-b685-a2da23ba19cc">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="fulladdress@gmail.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write feedback here" required></textarea>

      <button type="submit">Send Email</button>
    </form>
  </div>

</body>
</html>
